<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 1px solid black;
        }
    </style>

        <title> LOG </title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="../components/images/icon.png">

        <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">

</head>


<body>

<h3>  <br>  <br>  </h3>
<h6>SNAKE</h6>

<!-- NAV BAR -->
<script id="replace_with_navbar" src="nav.js"></script>

<div style="text-align: center;">
<canvas width="400" height="400" id="game"></canvas>
</div>

<script>
    var canvas = document.getElementById('game');
    var context = canvas.getContext('2d');

    var grid = 16;

    // Time control variables
    var fps = 15; // desired frames per second
    var frameDuration = 1000 / fps; // duration of one frame in milliseconds
    var lastRender = 0;

    var snake = {
        x: 160,
        y: 160,
        dx: grid,
        dy: 0,
        cells: [],
        maxCells: 4
    };

    var fruit = {
        x: 320,
        y: 320
    };

    var score = 0;
    var highscore = 0;
    var rank = "";
    var fruitnum = 0;
    var fruittype = "";

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
    }

    // Game loop with timestamp parameter
    function loop(timestamp) {
        requestAnimationFrame(loop);

        // Calculate the time elapsed since the last frame
        var delta = timestamp - lastRender;

        // Proceed only if the frame duration has passed
        if (delta >= frameDuration) {
            lastRender = timestamp - (delta % frameDuration); // Adjust lastRender in case of lag

            // Update game state and render
            update();
            draw();
        }
    }

    function update() {
        // Move snake by its velocity
        snake.x += snake.dx;
        snake.y += snake.dy;

        // Wrap snake position horizontally on edge of screen
        if (snake.x < 0) {
            snake.x = canvas.width - grid;
        } else if (snake.x >= canvas.width) {
            snake.x = 0;
        }

        // Wrap snake position vertically on edge of screen
        if (snake.y < 0) {
            snake.y = canvas.height - grid;
        } else if (snake.y >= canvas.height) {
            snake.y = 0;
        }

        // Keep track of where snake has been
        snake.cells.unshift({ x: snake.x, y: snake.y });

        // Remove cells as we move away from them
        if (snake.cells.length > snake.maxCells) {
            snake.cells.pop();
        }

        // Handle fruit collision and spawning
        handleFruit();
        checkCollision();
    }

    function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Display score and rank
        document.getElementById("score").innerHTML = "Score = " + score;
        document.getElementById("highscore").innerHTML = "High Score = " + highscore;
        document.getElementById("rank").innerHTML = rank;

        // Draw fruit
        drawFruit();

        // Draw snake
        context.fillStyle = 'green';
        snake.cells.forEach(function (cell) {
            context.fillRect(cell.x, cell.y, grid - 1, grid - 1);
        });
    }

    function handleFruit() {
        // Decide fruit type and set color
        if (fruitnum < 30) {
            fruittype = "apple";
            context.fillStyle = 'red';
        } else if (fruitnum >= 30 && fruitnum < 60) {
            fruittype = "grape";
            context.fillStyle = 'orchid';
        } else if (fruitnum >= 60 && fruitnum < 78) {
            if (snake.maxCells > 8) {
                fruittype = "orange";
                context.fillStyle = 'orange';
            } else {
                fruittype = "kiwi";
                context.fillStyle = 'greenyellow';
            }
        } else if (fruitnum >= 78 && fruitnum < 98) {
            fruittype = "kiwi";
            context.fillStyle = 'greenyellow';
        } else if (fruitnum >= 98) {
            fruittype = "acai";
            context.fillStyle = 'black';
        }

        // Check if snake ate the fruit
        if (snake.cells[0].x === fruit.x && snake.cells[0].y === fruit.y) {
            // Adjust snake length and score based on fruit type
            switch (fruittype) {
                case "apple":
                    snake.maxCells++;
                    break;
                case "grape":
                    snake.maxCells += 3;
                    break;
                case "orange":
                    snake.maxCells -= 5;
                    snake.cells.length = Math.max(snake.maxCells, 1);
                    break;
                case "kiwi":
                    snake.maxCells += 8;
                    break;
                case "acai":
                    snake.maxCells += 50;
                    break;
            }
            score++;
            fruitnum = getRandomInt(0, 100);

            // Spawn new fruit
            fruit.x = getRandomInt(0, 25) * grid;
            fruit.y = getRandomInt(0, 25) * grid;
        }
    }

    function drawFruit() {
        context.fillRect(fruit.x, fruit.y, grid - 1, grid - 1);
    }

    function checkCollision() {
        // Check collision with all cells after the head
        for (var i = 1; i < snake.cells.length; i++) {
            if (snake.cells[0].x === snake.cells[i].x && snake.cells[0].y === snake.cells[i].y) {
                resetGame();
                break;
            }
        }
    }

    function resetGame() {
        // Update high score
        if (score > highscore) {
            highscore = score;
        }

        // Determine rank
        if (highscore === 0) {
            rank = "";
        } else if (highscore < 10) {
            rank = "You can do better!";
        } else if (highscore < 20) {
            rank = "Getting there!";
        } else if (highscore < 30) {
            rank = "Not bad!";
        } else if (highscore < 45) {
            rank = "Great job!";
        } else if (highscore < 70) {
            rank = "Excellent!";
        } else if (highscore < 100) {
            rank = "You're amazing!";
        } else {
            rank = "Legendary!";
        }

        // Reset snake properties
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;
        score = 0;

        // Reset fruit
        fruit.x = getRandomInt(0, 25) * grid;
        fruit.y = getRandomInt(0, 25) * grid;
    }

    // Listen to keyboard events to move the snake
    document.addEventListener('keydown', function (e) {
        if (e.which === 37 && snake.dx === 0) {
            snake.dx = -grid;
            snake.dy = 0;
        } else if (e.which === 38 && snake.dy === 0) {
            snake.dy = -grid;
            snake.dx = 0;
        } else if (e.which === 39 && snake.dx === 0) {
            snake.dx = grid;
            snake.dy = 0;
        } else if (e.which === 40 && snake.dy === 0) {
            snake.dy = grid;
            snake.dx = 0;
        }
    });

    // Prevent scrolling with arrow keys
    window.addEventListener("keydown", function (e) {
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    }, false);

    // Start the game loop
    requestAnimationFrame(loop);
</script>


<h1 id = "score"> </h1>
<h1 id = "highscore"> </h1>
<div id = "rank" style="font-family: 'Lexend',serif; font-size: 20px; color: lightgray; text-align: center;  " > </div>

<h3> <br> </h3>

<div style="text-align: center;">
<img src = "../components/images/snakelegend.png" height = 400>
</div>

<h2> <br> </h2>

</body>
</html>
